name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean Install NPM Packages
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Force Hardcode Key and Inject Global Image Converter Patch
        run: |
          # 1. Inject your secret API Key into the codebase
          find src/ -type f -exec sed -i 's/process.env.VITE_GEMINI_API_KEY/"${{ secrets.VITE_GEMINI_API_KEY }}"/g' {} +
          find src/ -type f -exec sed -i 's/import.meta.env.VITE_GEMINI_API_KEY/"${{ secrets.VITE_GEMINI_API_KEY }}"/g' {} +
          find src/ -type f -exec sed -i 's/process.env.GEMINI_API_KEY/"${{ secrets.VITE_GEMINI_API_KEY }}"/g' {} +
          find src/ -type f -exec sed -i 's/import.meta.env.GEMINI_API_KEY/"${{ secrets.VITE_GEMINI_API_KEY }}"/g' {} +

          # 2. Add an explicit utility at the top of App.tsx to convert mobile localhost paths into base64 binary text strings
          sed -i '1s/^/async function convertLocalUrlToGeminiFormat(url) { if (url.startsWith("data:")) { const parts = url.split(","); return { inlineData: { data: parts[1], mimeType: parts[0].split(";")[0].split(":")[1] } }; } const res = await fetch(url); const blob = await res.blob(); return new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve({ inlineData: { data: reader.result.split(",")[1], mimeType: blob.type } }); reader.readAsDataURL(blob); }); }\n/' src/App.tsx

          # 3. Intercept the standard generation array array structures to evaluate our data converter utility dynamically
          find src/ -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/generateContent(\[prompt, image\])/generateContent([prompt, await convertLocalUrlToGeminiFormat(image)])/g' || true
          find src/ -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/generateContent(\[prompt, photo\])/generateContent([prompt, await convertLocalUrlToGeminiFormat(photo)])/g' || true
          find src/ -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/generateContent(\[image, prompt\])/generateContent([await convertLocalUrlToGeminiFormat(image), prompt])/g' || true
          find src/ -type f -name "*.tsx" -o -name "*.ts" | xargs sed -i 's/generateContent(\[photo, prompt\])/generateContent([await convertLocalUrlToGeminiFormat(photo), prompt])/g' || true

      - name: Build Web Code
        run: |
          npm run build --if-present

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fresh Mobile Platform Generation
        run: |
          rm -rf android
          npx cap init "Be Fit AI" "com.befit.app" --web-dir=dist
          npx cap add android

      - name: Open Full System Network and Camera Access
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/g' android/app/src/main/AndroidManifest.xml
          
          mkdir -p android/app/src/main/res/xml
          cat <<EOF > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficAllowed="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

      - name: Sync and Build App Binary
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyMobileApp
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
